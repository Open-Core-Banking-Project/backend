# Continuous integration for the backend.
#
# Scope note: the CI provider, the required check set and the scanning tools are
# governed by ADR-0010 (observability, audit evidence, sensitive-data redaction and
# retention) and by the observability and CI epic, neither of which is accepted yet.
# This workflow therefore implements only the Phase 0 epic 01 requirement to be
# CI-ready: restore, build, format verification, tests and dependency audit.
# Pin action versions and add the remaining scanning steps once ADR-0010 is accepted.

name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    name: Build, format and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Confirm the pinned SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Restore pinned tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Architecture tests
        run: dotnet test --no-build --configuration Release --filter Category=Architecture

      # Database tests need the local infrastructure stack, so they are excluded here and run by
      # scripts/db-verify.ps1 wherever a PostgreSQL instance is available.
      - name: Tests
        run: >-
          dotnet test --no-build --configuration Release
          --filter "Category!=Database&Category!=Integration"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Dependency vulnerability scan
        run: dotnet list package --vulnerable --include-transitive

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
